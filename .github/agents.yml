# EPURE Consumer Repository Configuration (.github/agents.yml)
# Generated by setup-repo — security boundaries are enforced by shared workflows (ADR-0010, ADR-0023).
harness: pi
models:
  planning: google/gemini-3.8-flash
  implementation: google/gemini-3.8-flash
  review: google/gemini-3.8-flash
merge_policy: strict
task_auto_merge_enabled: false
max_code_fix_attempts: 6
max_epic_phases: 2
max_transient_api_retries: 4
transient_retry_backoff_seconds: [5, 15, 45, 120]
llm_request_timeout_seconds: 900
job_timeout_minutes: 60
review_timeout_minutes: 30
max_concurrent_tasks_per_feature: 3
trace_retention_days: 30
preview_retention_days: 14
github_pages_previews: false
verification:
  wait_for_external_ci: true
  external_ci_timeout_minutes: 25
  grace_window_seconds: 45
  deferred_external_workflows: [".github/workflows/ci.yml"]
  targets:
    - name: rust-workspace
      working_directory: .
      kind: rust
      path_patterns: ["Cargo.toml", "crates/**"]
      install_command: "cargo fetch"
      typecheck_command: "cargo check --offline --workspace --all-targets"
      lint_command: "cargo fmt --all -- --check && cargo clippy --offline --workspace --all-targets --all-features -- -D warnings"
      test_command: "cargo test --offline --workspace --all-targets"
      build_command: "cargo build --offline --workspace"
    - name: packages/web
      working_directory: .
      kind: node
      path_patterns: ["packages/web/**", "packages/game-systems/**"]
      install_command: "npm --prefix packages/web install"
      typecheck_command: "npm --prefix packages/web run typecheck"
      lint_command: "npm --prefix packages/web run lint"
      test_command: "npm --prefix packages/web test"
      build_command: "npm --prefix packages/web run build"
web_tools:
  enabled: true
  phases: ["plan", "spec", "implementation"]
  max_requests_per_turn: 3
  max_requests_per_run: 8
  max_bytes_per_response: 16384
  timeout_ms: 8000
security_invariants:
  require_write_permission: true
  sandbox_isolation: true
  allow_agent_release: false
  auto_merge_dev: false
  auto_merge_main: false
