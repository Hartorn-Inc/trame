# Managed by Giskard-AI/epure@e88a04514ffdb76f004b21148aea70640e9c51c7 # v1.8.0
# Continuous Integration: Zizmor workflow security audit + Rust/WASM/Node Format, Lint, Typecheck, Tests & Build.
name: "CI"

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: "Quality (Format, Lint, Typecheck, Test & Build)"
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
      - name: Domain Glossary & ADR Integrity check
        run: python3 scripts/check-glossary-and-adrs.py
      - name: Impeccable Design System & WCAG AA Contrast check
        run: node scripts/check-impeccable-design.mjs
      - name: Rust Format check (cargo fmt)
        run: cargo fmt --all -- --check
      - name: Rust Lint check (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust Tests (cargo test)
        run: cargo test --workspace --all-targets
      - name: Web Package Quality (install, lint, typecheck, test, build)
        working-directory: packages/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint
          npm run typecheck
          npm test
          npm run build

  zizmor:
    name: "Zizmor"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the workflows zizmor audits
      actions: read # zizmor reads action metadata for online audits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          advanced-security: false
