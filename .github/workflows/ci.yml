# Managed by Giskard-AI/epure@e88a04514ffdb76f004b21148aea70640e9c51c7 # v1.8.0
# Continuous Integration: Zizmor workflow security audit + Rust/WASM/Node Format, Lint, Typecheck, Tests & Build
# + browser E2E journey against the production image.
name: "CI"

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, 'feature/**', 'stack/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: "Quality (Format, Lint, Typecheck, Test & Build)"
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: trame
          POSTGRES_USER: trame
          POSTGRES_PASSWORD: trame_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trame -d trame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WASM_PACK_VERSION: "0.15.1"
      WASM_PACK_SHA256: "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2" # x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
      - name: Install pinned wasm-pack
        run: |
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfLo "${RUNNER_TEMP}/${name}.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "${name}/wasm-pack"
          wasm-pack --version
      - name: Domain Glossary & ADR Integrity check
        run: python3 scripts/check-glossary-and-adrs.py
      - name: Impeccable Design System & WCAG AA Contrast check
        run: node scripts/check-impeccable-design.mjs
      - name: Rust Format check (cargo fmt)
        run: cargo fmt --all -- --check
      - name: Rust Lint check (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Terraform format, validate & tflint (make lint-terraform)
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its pinned ruleset from GitHub releases
        run: make lint-terraform
      # Not a service container: services cannot pass Silo its `server /data` command.
      - name: Start Silo for the S3 integration tests
        run: |
          docker run --detach --name silo --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=trame_ci_silo --env MINIO_ROOT_PASSWORD=trame_ci_silo_secret \
            pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7 \
            server /data
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
      - name: Rust Tests (cargo test, PostgreSQL + S3 integration)
        env:
          DATABASE_URL: postgresql://trame:trame_ci_password@localhost:5432/trame
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_BUCKET: trame-test
          TEST_S3_ACCESS_KEY_ID: trame_ci_silo
          TEST_S3_SECRET_ACCESS_KEY: trame_ci_silo_secret
        run: cargo test --workspace --all-targets
      # Same outputs as `make wasm`; required by web lint/typecheck/tests/build and the parity test.
      - name: WASM Build (wasm-pack trame-engine, browser + Node)
        run: |
          wasm-pack build crates/trame-engine --target web --out-dir ../../packages/web/src/wasm
          wasm-pack build crates/trame-engine --target nodejs --out-dir ../../packages/trame-engine-node
      - name: Game System Tests (dnd5e)
        working-directory: packages/web
        run: node --test "../game-systems/dnd5e/tests/**/*.test.ts"
      - name: Web Package Quality (install, lint, typecheck, test, build)
        working-directory: packages/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint
          npm run typecheck
          npm test
          npm run build

  image:
    name: "Production Image Build"
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production Dockerfile (WASM + SPA + server)
        run: docker build --tag trame-server:ci .
      # Hands the built image to the `e2e` job so it is not rebuilt there.
      - name: Export production image for E2E
        run: docker save --output "${RUNNER_TEMP}/trame-server-image.tar" trame-server:ci
      - name: Upload production image for E2E
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trame-server-image
          path: ${{ runner.temp }}/trame-server-image.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true # re-running the job reuses the artifact name within the run

  deploy-smoke:
    name: "Production Compose Smoke (Caddy, Silo, Backup + Restore)"
    needs: [image]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trame-server-image
          path: ${{ runner.temp }}/trame-server-image
      - name: Load production image
        run: docker load --input "${RUNNER_TEMP}/trame-server-image/trame-server-image.tar"
      - name: Production Compose smoke (make deploy-compose-smoke)
        env:
          TRAME_IMAGE: trame-server:ci
        run: make deploy-compose-smoke

  e2e:
    name: "Browser E2E (GM + Three Players Journey)"
    needs: [image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trame-server-image
          path: ${{ runner.temp }}/trame-server-image
      - name: Load production image as trame-server:e2e
        run: |
          docker load --input "${RUNNER_TEMP}/trame-server-image/trame-server-image.tar"
          docker tag trame-server:ci trame-server:e2e
      - name: GM + three players Playwright journey (make e2e)
        run: make e2e
      # Recordings exist even when the journey fails part-way; the MP4 is the evidence to review.
      - name: Side-by-side GM/player video (make e2e-video)
        if: ${{ !cancelled() && hashFiles('e2e/artifacts/gm.webm') != '' && hashFiles('e2e/artifacts/player.webm') != '' }}
        run: make e2e-video
      - name: E2E job summary
        if: ${{ !cancelled() }}
        run: |
          results=e2e/artifacts/results.json
          phases=e2e/artifacts/phases.json
          {
            echo "### Browser E2E (GM + Three Players Journey)"
            if [ -f "$results" ]; then
              jq -r '.stats | "| Passed | Failed | Flaky | Skipped | Duration |",
                "|---|---|---|---|---|",
                "| \(.expected // 0) | \(.unexpected // 0) | \(.flaky // 0) | \(.skipped // 0) | \((.duration // 0) / 1000 | floor)s |"' "$results"
            else
              echo "No \`results.json\`: the Playwright suite did not run (see the job log)."
            fi
            if [ -f "$phases" ]; then
              jq -r '.results | "\nJourney phases: \(map(select(.status == "pass")) | length) passed, \(map(select(.status == "fail")) | length) failed.",
                (map(select(.status == "fail"))[] | "- FAIL \(.phase)")' "$phases"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            e2e/artifacts/gm-player-side-by-side.mp4
            e2e/artifacts/report
            e2e/artifacts/results.json
            e2e/artifacts/phases.json
            e2e/artifacts/harness/*.log
            e2e/artifacts/server.log
            e2e/artifacts/postgres.log
          if-no-files-found: warn
          retention-days: 90
          overwrite: true # re-running the job reuses the artifact name within the run

  zizmor:
    name: "Zizmor"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the workflows zizmor audits
      actions: read # zizmor reads action metadata for online audits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          advanced-security: false
