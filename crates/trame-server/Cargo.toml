[package]
name = "trame-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
trame-engine = { path = "../trame-engine", features = ["schema"] }
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
axum.workspace = true
async_zip = { version = "=0.0.19", features = ["tokio", "deflate"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
data-encoding = "=2.11.1"
flate2 = "=1.1.11"
futures-lite = "=2.6.1"
futures-util.workspace = true
hmac = "=0.13.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rand.workspace = true
rand_chacha.workspace = true
rmp-serde.workspace = true
schemars = { version = "=1.2.3", features = ["uuid1"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "=0.11.0"
sha2 = "=0.11.1"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs", "compression-gzip", "compression-br", "compression-zstd"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true, features = ["v5"] }
