[workspace]
resolver = "2"
members = [
    "crates/trame-engine",
    "crates/trame-server",
    "crates/trame-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Hartorn-Inc/trame"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws", "macros"] }
futures-util = "=0.3.34"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
uuid = { version = "=1.29.0", features = ["v4", "serde", "js"] }
