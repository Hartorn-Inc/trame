[workspace]
resolver = "2"
members = [
    "crates/trame-engine",
    "crates/trame-server",
    "crates/trame-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Hartorn-Inc/trame"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
