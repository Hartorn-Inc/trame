[workspace]
resolver = "2"
members = [
    "crates/trame-engine",
    "crates/trame-server",
    "crates/trame-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Hartorn-Inc/trame"

[workspace.lints.rust]
async_fn_in_trait = "allow"

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
doc_lazy_continuation = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_sort_by = "allow"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = "0.3.34"
rand = "0.10.3"
rand_chacha = "0.10.0"
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
