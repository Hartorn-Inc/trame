# Harness-only front for the production image (see docker-compose.e2e.yml).
# Serves the SPA bundle extracted from the image and forwards every API and
# WebSocket request to the unmodified trame-server. It exists because the
# server's own SPA fallback answers Vite's `/assets/*` bundle with a JSON 404
# and stamps `default-src 'none'` on index.html, so the UI cannot boot from
# the image alone. Remove it once the server serves the SPA itself.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream trame {
    server trame-server:8080;
}

server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;

    location /api/   { proxy_pass http://trame; }
    location /ws/    { proxy_pass http://trame; }
    location /healthz { proxy_pass http://trame; }

    # Built bundle files first; anything else under /assets belongs to the server.
    location /assets/ { try_files $uri @trame; }
    location @trame   { proxy_pass http://trame; }

    location / { try_files $uri /index.html; }
}
