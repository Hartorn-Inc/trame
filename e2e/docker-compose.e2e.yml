# Browser E2E overlay for deploy/compose/docker-compose.prod.yml (see `make e2e`
# and e2e/scripts/run-e2e.sh). The stack runs with `--profile silo`, so map
# images live in Silo and reach the browsers through signed redirects.
#
# The Playwright container sits on the `edge` network, next to trame-server
# and Silo but outside the server's container, so the harness can SIGKILL,
# restart or stop the server while the browsers stay open. `support/forward.ts`
# pipes http://localhost:8080 to trame-server:8080, which keeps the browser on a
# secure `localhost` context that matches TRAME_PUBLIC_ORIGIN for the WebSocket
# Origin check. Signed downloads point at http://silo:9000 (S3_PUBLIC_ENDPOINT),
# a cross-origin URL the bucket CORS rule from storage-init must allow.
services:
  # Project directory is the repository root, so the ops build context is
  # re-anchored here (the prod file's `./ops` is relative to deploy/compose).
  storage-init:
    build:
      context: ./deploy/compose/ops
  backup:
    build:
      context: ./deploy/compose/ops

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    profiles: ["e2e"]
    ipc: host
    depends_on:
      - trame-server
    networks:
      - edge
    working_dir: /e2e
    environment:
      E2E_BASE_URL: http://localhost:8080
      E2E_UPSTREAM: trame-server:8080
      E2E_ARTIFACTS_DIR: /e2e/artifacts
      E2E_SLOW_MO: ${E2E_SLOW_MO:-250}
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    command:
      - sh
      - -c
      - >-
        npm ci --no-audit --no-fund && npx playwright test; rc=$$?;
        chown -R ${E2E_UID:-1000}:${E2E_GID:-1000} /e2e/artifacts /e2e/test-results 2>/dev/null;
        exit $$rc

volumes:
  e2e_node_modules:
