apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: trame-server
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      containers:
        - image: gcr.io/trame-project/trame-server:latest
          ports:
            - name: http1
              containerPort: 8080
          # Secrets come from Secret Manager; the runtime service account needs
          # `roles/secretmanager.secretAccessor` on each referenced secret.
          env:
            # Any value other than `dev` makes trame-server refuse to start without every secret below.
            - name: TRAME_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trame-database-url
                  key: latest
            # 64 hex chars (32 bytes): AES-256-GCM key encrypting stored TOTP secrets.
            - name: MASTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trame-master-encryption-key
                  key: latest
            # HMAC-SHA256 key signing presigned asset download URLs (>= 32 chars).
            - name: TRAME_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trame-jwt-secret
                  key: latest
            # HMAC-SHA256 key for campaign invite (magic link) tokens (>= 32 chars).
            - name: TRAME_INVITE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trame-invite-jwt-secret
                  key: latest
            # Public browser origin (CORS / Origin checks, links); replace before deploying.
            - name: TRAME_PUBLIC_ORIGIN
              value: https://trame.example.com
            - name: TRAME_COOKIE_SECURE
              value: 'true'
            # Built SPA directory baked into the image by the Dockerfile.
            - name: TRAME_STATIC_DIR
              value: /app/static
            - name: RUST_LOG
              value: info
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
